      <text x="452" y="484">Personne physique</text>
      <text x="452" y="500" font-size="11.5" fill="#5a5a68">en co-souscription</text>
      <text x="588" y="491">●●●●●●●●</text>
      <text x="700" y="491">l●●●●@●●●●.fr</text>
      <text x="908" y="491">—</text>
      <text x="1024" y="491">Immo One</text>
      <text x="1132" y="491">Pleine propriété</text>
      <text x="1262" y="491">1 000,00 €</text>
      <text x="1362" y="491" text-anchor="middle">5</text>

      <!-- ligne 4 -->
      <text x="316" y="551">●●●●● (SA)</text>
      <text x="452" y="551">Personne morale</text>
      <text x="588" y="551">●●●●●●●●</text>
      <text x="700" y="551">s●●●●@●●●●.fr</text>
      <text x="908" y="551">06 ●● ●● ●● ●●</text>
      <text x="1024" y="551">Immo One</text>
      <text x="1132" y="551">Pleine propriété</text>
      <text x="1262" y="551">1 000,00 €</text>
      <text x="1362" y="551" text-anchor="middle">5</text>

      <!-- ligne 5 -->
      <text x="316" y="611">M. ●●●●●</text>
      <text x="452" y="611">Personne morale</text>
      <text x="588" y="611">●●●●●●●●</text>
      <text x="700" y="611">m●●●●@●●●●.fr</text>
      <text x="908" y="611">06 ●● ●● ●● ●●</text>
      <text x="1024" y="611">Rente Zen</text>
      <text x="1132" y="611">Pleine propriété</text>
      <text x="1262" y="611">1 000,00 €</text>
      <text x="1362" y="611" text-anchor="middle">5</text>

