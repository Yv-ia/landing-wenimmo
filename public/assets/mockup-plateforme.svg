      <text x="452" y="431">Personne morale</text>
      <text x="588" y="431">●●●●●●●●</text>
      <text x="700" y="431">c●●●●@●●●●.fr</text>
      <text x="908" y="431">06 ●● ●● ●● ●●</text>
      <text x="1024" y="431">SCPI Néo</text>
      <text x="1132" y="431">Pleine propriété</text>
      <text x="1262" y="431">255,68 €</text>
      <text x="1362" y="431" text-anchor="middle">1</text>

      <!-- ligne 3 -->
