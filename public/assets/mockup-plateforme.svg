        <text x="316" y="671">●●●●●</text>
        <text x="452" y="671">Personne morale</text>
        <text x="588" y="671">●●●●●●●●</text>
        <text x="700" y="671">j●●●●@●●●●.fr</text>
        <text x="1024" y="671">Corum</text>
