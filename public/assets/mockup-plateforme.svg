<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Mona Sans', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <clipPath id="frame"><rect width="1440" height="900" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
