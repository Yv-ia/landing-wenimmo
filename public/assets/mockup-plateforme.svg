    <circle cx="44" cy="22" r="6" fill="#febc2e"/>
    <circle cx="64" cy="22" r="6" fill="#28c840"/>
    <rect x="560" y="10" width="320" height="24" rx="12" fill="#ffffff"/>
    <text x="720" y="26" text-anchor="middle" font-size="12" fill="#8b8b9e">app.wenimmo.com</text>

    <!-- ============ SIDEBAR ============ -->
    <rect x="0" y="44" width="240" height="856" fill="#f5f5f8"/>
    <line x1="240" y1="44" x2="240" y2="900" stroke="#e7e7ef"/>

    <!-- Logo (skyline + wordmark) -->
    <g transform="translate(28,72)" stroke="#4646f0" stroke-width="2.4" fill="none">
